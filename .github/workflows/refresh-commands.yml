name: Refresh Salesforce CLI data
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-salesforce-commands
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.23'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies and latest Salesforce CLI
        run: |
          bun install --frozen-lockfile
          bun add --global @salesforce/cli@latest
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Test, refresh, and build
        env:
          SF_DISABLE_TELEMETRY: 'true'
        run: |
          bun test
          bun run scripts/refresh-commands.ts
          bun run build
      - name: Commit updated snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if git diff --quiet -- src/data/commands.json; then
            echo 'Command data unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/commands.json
          git commit -m 'chore: refresh Salesforce CLI command data'
          gh auth setup-git
          # Non-force push: branch protection or concurrent commits must fail safely.
          git push origin "HEAD:refs/heads/$BASE"
